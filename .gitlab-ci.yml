stages:
  - test
  - release

tests:
  stage: test
  image: python:3.12
  script:
    - pip install -e ".[dev]"
    - pytest --cov=ometha

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest

  rules:
    - if: '$CI_COMMIT_TAG'

  script:
    - echo "Creating release for $CI_COMMIT_TAG"

  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Release $CI_COMMIT_TAG'
    description: 'Automatisch erzeugter Release'