stages:
  - package
  - release

variables:
  PACKAGE_NAME: "source-code"

create_zip:
  stage: package
  image: alpine:latest

  rules:
    - if: '$CI_COMMIT_TAG'

  before_script:
    - apk add --no-cache git curl

  script:
    - ZIP_FILE="${CI_PROJECT_NAME}-${CI_COMMIT_TAG}.zip"

    # Archiv des getaggten Commits erzeugen
    - git archive --format=zip --output="$ZIP_FILE" "$CI_COMMIT_SHA"

    # In die GitLab Generic Package Registry hochladen
    - |
      curl --fail-with-body \
           --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "$ZIP_FILE" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}/${ZIP_FILE}"

  artifacts:
    paths:
      - "*.zip"
    expire_in: 1 week

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest

  rules:
    - if: '$CI_COMMIT_TAG'

  script:
    - ZIP_FILE="${CI_PROJECT_NAME}-${CI_COMMIT_TAG}.zip"

    - |
      glab release create "$CI_COMMIT_TAG" \
        --name "Release $CI_COMMIT_TAG" \
        --notes "Automatisch erzeugter Release für Tag $CI_COMMIT_TAG" \
        --assets-link "{
          \"name\":\"Source Archive\",
          \"url\":\"${CI_PROJECT_URL}/-/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}/${ZIP_FILE}\"
        }"